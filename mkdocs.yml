site_name: Prakash Kumar
site_description: Technical Writer | AI Documentation | Developer Documentation
site_author: Prakash Kumar
site_url: https://prakashkmr48.github.io/portfolio/

theme:
  name: material

  logo: assets/logos/logo.png
  favicon: assets/logos/favicon.png
  

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prakashkmr48

    - icon: fontawesome/solid/envelope
      link: mailto:prakashkmr48@gmail.com

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - About: about.md

  - Portfolio:
      - Overview: portfolio.md

  - Documentation:
      - Overview: documentation/index.md
      - API Documentation: documentation/api.md
      - Developer Guides: documentation/developer.md
      - User Guides: documentation/user.md
      - Installation Guides: documentation/installation.md
      - Configuration Guides: documentation/configuration.md
      - Troubleshooting: documentation/troubleshooting.md
      - Release Notes: documentation/release-notes.md
      - Knowledge Base: documentation/kb.md

  - Cloud:
      - AWS: cloud/aws.md
      - Azure: cloud/azure.md
      - Kubernetes: cloud/kubernetes.md
      - Docker: cloud/docker.md

  - AI:
      - AI Documentation: ai/index.md
      - LLM: ai/llm.md
      - RAG: ai/rag.md
      - Prompt Engineering: ai/prompts.md

  - Blog: blog/index.md

  - Resume: resume.md

  - Contact: contact.md