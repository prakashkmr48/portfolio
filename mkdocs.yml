site_name: Prakash Kumar
site_description: Technical Writer | AI Documentation | Developer Documentation
site_author: Prakash Kumar
site_url: https://prakashkmr48.github.io/portfolio/
repo_url: https://github.com/prakashkmr48/portfolio
repo_name: GitHub Repository

theme:
  name: material

  logo: assets/logos/logo.png
  favicon: assets/logos/favicon.png

  language: en

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top

    - search.highlight
    - search.suggest

    - content.code.copy
    - content.tabs.link

    - toc.follow

    # Repository integration
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prakashkmr48

    - icon: fontawesome/solid/envelope
      link: mailto:prakashkmr48@gmail.com

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - About: about.md

  - Portfolio:
      - Overview: portfolio.md

  - Documentation:
      - Overview: documentation/index.md
      - API Documentation: documentation/api.md
      - Developer Guides: documentation/developer.md
      - User Guides: documentation/user.md
      - Installation Guides: documentation/installation.md
      - Configuration Guides: documentation/configuration.md
      - Troubleshooting: documentation/troubleshooting.md
      - Release Notes: documentation/release-notes.md
      - Knowledge Base: documentation/kb.md

  - Cloud:
      - AWS: cloud/aws.md
      - Azure: cloud/azure.md
      - Kubernetes: cloud/kubernetes.md
      - Docker: cloud/docker.md

  - AI:
      - AI Documentation: ai/index.md
      - LLM: ai/llm.md
      - RAG: ai/rag.md
      - Prompt Engineering: ai/prompts.md

  - Blog: blog/index.md

  - Resume: resume.md
  - Contact: contact.md
